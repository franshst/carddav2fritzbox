# CardDAV to FritzBox Sync Configuration
# 
# This is a sample configuration file. Replace with your actual values.
# For security reasons, do NOT commit your personal config.ini to version control.
# Add "config.ini" to .gitignore
# Recommended, make this file readable only to the sync program

[general]
# Contact name formatting preference
name_order = first_name_first

[fritzbox]
# FritzBox device connection details
url = https://fritz.box
username = your_fritzbox_username
password = your_fritzbox_password
target_book = CardDAV Sync
country = DE
region = DE
# Regional codes for phone number normalization
country_code = +49
region_code = 30

[regional]
# Optional regional settings (overrides FritzBox defaults if present)
country = DE
region = DE
country_code = +49
region_code = 30

[source_1]
# Primary CardDAV source - highest priority (use priority = 1)
url = https://nextcloud.example.com/carddav
username = your_nextcloud_username
password = your_nextcloud_password
priority = 1

[source_2]
# Secondary CardDAV source - medium priority (use priority = 2)
url = https://caldav.example.com/addressbook
username = your_caldav_username
password = your_caldav_password
priority = 2

# Additional sources can be added as needed:
# [source_3]
# url = https://another.example.com/carddav
# username = another_user
# password = another_password
# priority = 3
