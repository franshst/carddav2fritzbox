# CardDAV to FritzBox Sync Configuration
# 
# This is a sample configuration file. Replace with your actual values.
# For security reasons, do NOT commit your personal config.ini to version control.
# Add "config.ini" to .gitignore
# Recommended, make this file readable only to the sync program

[general]
# Contact name formatting preference
name_order = first_name_first

[fritzbox]
# FritzBox device connection details
url = https://fritz.box
username = your_fritzbox_username
password = your_fritzbox_password
target_book = CardDAV Sync
country = DE
region = DE
# Contact picture sync (FR-020, optional). The FritzBox displays a contact
# picture only when <imageURL> references a file on its own storage, so the
# converted JPEGs are uploaded over FTP and referenced via a file:/// URL.
# Picture sync requires BOTH values; leave them empty to disable it:
#   fonpix_dir = FTP directory on the box to upload pictures into, as the
#                box's FTP server sees it (e.g. /FRITZ/fonpix on internal
#                storage, or /<stick-name>/FRITZ/fonpix on a USB stick)
#   imagepath  = file:/// URL of the SAME directory as seen by the box itself
#                (e.g. file:///var/InternerSpeicher/FRITZ/fonpix). The box
#                resolves this path internally; it is not fetched over the
#                network. To find the exact value, export a phonebook with a
#                contact picture from the box and read its <imageURL>.
# The FTP host/user/password default to the box and the web-UI credentials;
# uncomment the next three lines to use a dedicated FTP/NAS user instead.
# ftp_host = fritz.box
# ftp_user = your_ftp_username
# ftp_pass = your_ftp_password
# Use explicit FTPS instead of plain FTP when your box requires it:
# ftp_plain = false
# When the picture directory is unavailable the sync aborts BEFORE uploading,
# leaving the existing phonebook intact (FR-021).

[regional]
# Regional codes for phone number normalization
country_code = +49                  # REQUIRED (FR-017)
area_code = 30                      # REQUIRED (FR-017)
international_access_code = 00      # REQUIRED for normalization (FR-005)

[source_1]
# Primary CardDAV source - highest priority (use priority = 1)
url = https://nextcloud.example.com/carddav
username = your_nextcloud_username
password = your_nextcloud_password
priority = 1

[source_2]
# Secondary CardDAV source - medium priority (use priority = 2)
url = https://caldav.example.com/addressbook
username = your_caldav_username
password = your_caldav_password
priority = 2

# Additional sources can be added as needed:
# [source_3]
# url = https://another.example.com/carddav
# username = another_user
# password = another_password
# priority = 3
