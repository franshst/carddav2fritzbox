# carddav2fritzbox — Docker Swarm stack with scheduled one-shot sync runs.
#
# Deploy:   docker stack deploy -c docker/docker-compose.yml carddav2fritzbox
# Schedule: override SYNC_CRON in the environment at deploy time, e.g.
#           SYNC_CRON="0 4 * * *" docker stack deploy ...
# Changing the schedule requires only a redeploy — never an image rebuild
# (SC-005).
#
# The non-secret configuration is delivered as a Swarm CONFIG, so it is
# distributed to every node by the cluster itself — no bind mounts, works
# across multiple managers/nodes. Credentials never live here; they arrive
# as Docker secrets (see docker/deploy.sh and docker/swarm.md).

configs:
  sync_config:
    file: ${SYNC_CONFIG_PATH:-./config.ini}

# Credentials live exclusively as (external) Docker secrets, created e.g. by
# docker/deploy.sh; names are normative per contracts/env-secrets.md.
# NOTE: no separate FTP secret is needed — the FTP upload reuses the FritzBox
# web credentials unless a dedicated FTP user is configured (then add an
# ftp_password secret mapping to FTP_PASSWORD yourself).
secrets:
  fritzbox_password:
    external: true
  carddav_1_password:
    external: true
  carddav_2_password:
    external: true
  carddav_3_password:
    external: true
  smtp_password:
    external: true

services:
  carddav2fritzbox:
    image: ${SYNC_IMAGE:-carddav2fritzbox:local} # heterogeneous Swarm (amd64+arm64): must be a docker/build.sh --push manifest list, not a local tag
    # One-shot service: swarm-cronjob triggers an update of this service on
    # the schedule below; overlapping triggers are skipped while a task is
    # still running (spec Assumptions).
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: none
      resources:
        limits:
          memory: 512M
    configs:
      - source: sync_config
        target: /config/config.ini
        # mode 0444: world-readable is acceptable for NON-secret config;
        # all credentials must be secrets instead (FR-007/FR-008).
    environment:
      TZ: ${TIMEZONE:-Europe/Amsterdam}
      # Failure-notification settings (optional; notifications disabled when
      # SMTP_HOST/EMAIL_FROM/EMAIL_TO are unset) — see contracts/env-secrets.md
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
      # Comma-separated list of secrets this deployment expects to exist;
      # the wrapper fails fast with exit code 2 if one is absent (FR-014).
      SYNC_EXPECTED_SECRETS: ${SYNC_EXPECTED_SECRETS:-fritzbox_password}
    secrets:
      - fritzbox_password
      - carddav_1_password
      - carddav_2_password
      - carddav_3_password
      - smtp_password
    labels:
      - swarm.cronjob.enable=true
      - swarm.cronjob.schedule=${SYNC_CRON:-0 3 * * *}

  swarm-cronjob:
    image: crazymax/swarm-cronjob:latest
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: ${TIMEZONE:-Europe/Amsterdam}
      LOG_LEVEL: info
